<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bater ponto</title>
  <link rel="stylesheet" href="/static/css/estilo.css">
</head>
<body>
  <main class="cartao">
    <h1>Bater ponto</h1>
    <form id="formulario">
      <label for="usuario_id">ID</label>
      <input id="usuario_id" type="text" inputmode="numeric" pattern="[0-9]+" required autocomplete="off">

      <label for="pin">PIN</label>
      <input id="pin" type="password" inputmode="numeric" pattern="[0-9]{4,6}" required autocomplete="off">

      <button type="submit">Registrar</button>
    </form>
    <p id="mensagem" role="status"></p>
    <p id="comprovante" hidden><a id="link-comprovante" target="_blank" rel="noopener">Abrir comprovante (PDF)</a></p>
  </main>

  <script src="/static/js/bater-ponto.js"></script>
</body>
</html>
